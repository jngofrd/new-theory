<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Theory</title>
<meta name="description" content="New Theory">
<style>
  :root{
    --bg: #050505;
    --bg-soft: #0c0c0c;
    --line-bright: #ffffff;
    --line-dim: #3a3a3a;
    --text: #f5f5f5;
    --text-dim: #8a8a8a;
    --accent: #ffffff;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x:hidden;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #globe-canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
  }
  .hero-content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:0 24px;
    pointer-events:none;
  }
  .hero-vignette{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
    background: radial-gradient(closest-side, rgba(5,5,5,0.82) 0%, rgba(5,5,5,0.45) 45%, rgba(5,5,5,0) 72%);
  }
  .logo{
    width:min(360px, 60vw);
    height:auto;
    filter: drop-shadow(0 0 24px rgba(255,255,255,0.3));
  }
  .tagline{
    margin-top:18px;
    font-size:14px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .scroll-cue{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    width:1px;
    height:40px;
    background:linear-gradient(to bottom, transparent, var(--line-bright));
    opacity:0.6;
    animation: pulse-cue 2.4s ease-in-out infinite;
  }
  @keyframes pulse-cue{
    0%,100%{ opacity:0.2; }
    50%{ opacity:0.8; }
  }

  /* ---------- Video section ---------- */
  .section{
    max-width:960px;
    margin:0 auto;
    padding:96px 24px;
  }
  .video-wrap{
    position:relative;
    width:100%;
    padding-top:56.25%; /* 16:9 */
    background:var(--bg-soft);
    border:1px solid var(--line-dim);
    border-radius:4px;
    overflow:hidden;
    box-shadow: 0 0 40px rgba(255,255,255,0.06);
  }
  .video-wrap iframe{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:0;
  }

  /* ---------- Contact section ---------- */
  .contact-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-bottom:140px;
  }
  .contact-heading{
    font-size:13px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:22px;
  }
  .contact-btn{
    display:inline-block;
    padding:16px 44px;
    border:1px solid var(--accent);
    border-radius:999px;
    color:var(--accent);
    text-decoration:none;
    font-size:14px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }
  .contact-btn:hover{
    background:var(--accent);
    color:#050505;
    box-shadow:0 0 30px rgba(255,255,255,0.4);
  }

  footer{
    text-align:center;
    padding:28px 24px 40px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.08em;
  }
</style>
</head>
<body>

  <section class="hero">
    <canvas id="globe-canvas"></canvas>
    <div class="hero-vignette"></div>
    <div class="hero-content">
      <img class="logo" src="assets/logo.png" alt="New Theory">
    </div>
    <div class="scroll-cue"></div>
  </section>

  <section class="section">
    <div class="video-wrap">
      <!-- TODO: replace VIDEO_ID_HERE with the real YouTube video ID before launch -->
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_HERE"
        title="New Theory"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <section class="contact-section">
    <div class="contact-heading">Get in touch</div>
    <!-- TODO: replace with the real contact address before launch -->
    <a class="contact-btn" href="mailto:hello@newtheory.world">Contact</a>
  </section>

  <footer>&copy; <span id="year"></span> New Theory</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  (function(){
    const canvas = document.getElementById('globe-canvas');
    const hero = document.querySelector('.hero');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

    const globe = new THREE.Group();
    scene.add(globe);

    const RADIUS = 2;

    function latLonToVector3(lat, lon, radius){
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    // Faint lat/long graticule for the classic "wireframe" grid feel
    function buildGraticule(){
      const dimMat = new THREE.LineBasicMaterial({ color: 0x4d4d4d, transparent:true, opacity:0.5 });
      const group = new THREE.Group();

      for (let lat = -80; lat <= 80; lat += 20) {
        const pts = [];
        for (let lon = -180; lon <= 180; lon += 4) {
          pts.push(latLonToVector3(lat, lon, RADIUS));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        group.add(new THREE.Line(geo, dimMat));
      }
      for (let lon = -180; lon < 180; lon += 20) {
        const pts = [];
        for (let lat = -90; lat <= 90; lat += 4) {
          pts.push(latLonToVector3(lat, lon, RADIUS));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        group.add(new THREE.Line(geo, dimMat));
      }
      return group;
    }

    globe.add(buildGraticule());

    // Accurate coastlines from real-world land geometry (Natural Earth 110m via world-atlas)
    function ringToLineLoop(ring, material){
      const pts = ring.map(([lon, lat]) => latLonToVector3(lat, lon, RADIUS * 1.001));
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      return new THREE.LineLoop(geo, material);
    }

    function addLandOutlines(topology){
      const landMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.85 });
      const landGeo = topojson.feature(topology, topology.objects.land);
      const group = new THREE.Group();

      landGeo.features.forEach(feature => {
        const geom = feature.geometry;
        if (!geom) return;
        const polygons = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
        polygons.forEach(polygon => {
          polygon.forEach(ring => {
            group.add(ringToLineLoop(ring, landMat));
          });
        });
      });

      globe.add(group);
    }

    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')
      .then(res => res.json())
      .then(addLandOutlines)
      .catch(() => { /* offline fallback: graticule alone still reads as a wireframe globe */ });

    // ---- Meteor impact: a trail punched clean through the globe, with
    // geometric debris frozen mid-blast around the exit points. The trail
    // and debris live in the scene (not the globe group) so they hold
    // still in space while the planet keeps turning underneath them.
    const impactAxis = new THREE.Vector3(1, -0.4, 0).normalize();

    function buildMeteorTrail(){
      const length = 6;
      const geo = new THREE.CylinderGeometry(0.045, 0.045, length, 6, 1, true);
      const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe:true });
      const trail = new THREE.Mesh(geo, mat);
      trail.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), impactAxis);
      scene.add(trail);

      // Bright entry/exit points where the trail punches the globe surface
      [1, -1].forEach(sign => {
        const glow = new THREE.Mesh(
          new THREE.SphereGeometry(0.09, 10, 10),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        glow.position.copy(impactAxis).multiplyScalar(RADIUS * sign);
        scene.add(glow);
      });
    }
    buildMeteorTrail();

    const debris = [];
    function buildDebris(){
      const shapeMakers = [
        () => new THREE.TetrahedronGeometry(1),
        () => new THREE.BoxGeometry(1, 1, 1),
        () => new THREE.OctahedronGeometry(1),
        () => new THREE.IcosahedronGeometry(1),
      ];
      const count = 130;

      // Two axes perpendicular to the impact axis, used to scatter debris
      // outward in a cone around each end of it.
      const arbitrary = Math.abs(impactAxis.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      const perpA = new THREE.Vector3().crossVectors(impactAxis, arbitrary).normalize();
      const perpB = new THREE.Vector3().crossVectors(impactAxis, perpA).normalize();

      for (let i = 0; i < count; i++) {
        const sign = Math.random() < 0.5 ? 1 : -1;
        const dist = RADIUS + 0.3 + Math.pow(Math.random(), 1.6) * 4.2;
        const spread = Math.pow(Math.random(), 0.6) * dist * 0.42;
        const angle = Math.random() * Math.PI * 2;

        const pos = impactAxis.clone().multiplyScalar(dist * sign)
          .add(perpA.clone().multiplyScalar(Math.cos(angle) * spread))
          .add(perpB.clone().multiplyScalar(Math.sin(angle) * spread));

        const geo = shapeMakers[Math.floor(Math.random() * shapeMakers.length)]();
        const mat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          wireframe: true,
          transparent: true,
          opacity: 0.35 + Math.random() * 0.5,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.scale.setScalar(0.06 + Math.random() * 0.22);
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        scene.add(mesh);

        debris.push({
          mesh,
          spin: new THREE.Vector3(
            (Math.random() - 0.5) * 0.01,
            (Math.random() - 0.5) * 0.01,
            (Math.random() - 0.5) * 0.01
          ),
        });
      }

      // Guarantee a close, larger cluster right at each impact point so
      // both ends read clearly even on narrow/portrait viewports, where
      // the wider random field can end up mostly out of frame.
      [1, -1].forEach(sign => {
        for (let i = 0; i < 9; i++) {
          const dist = RADIUS + 0.25 + Math.random() * 0.9;
          const spread = Math.random() * dist * 0.3;
          const angle = Math.random() * Math.PI * 2;

          const pos = impactAxis.clone().multiplyScalar(dist * sign)
            .add(perpA.clone().multiplyScalar(Math.cos(angle) * spread))
            .add(perpB.clone().multiplyScalar(Math.sin(angle) * spread));

          const geo = shapeMakers[Math.floor(Math.random() * shapeMakers.length)]();
          const mat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: true,
            transparent: true,
            opacity: 0.55 + Math.random() * 0.4,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(pos);
          mesh.scale.setScalar(0.14 + Math.random() * 0.16);
          mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          scene.add(mesh);

          debris.push({
            mesh,
            spin: new THREE.Vector3(
              (Math.random() - 0.5) * 0.01,
              (Math.random() - 0.5) * 0.01,
              (Math.random() - 0.5) * 0.01
            ),
          });
        }
      });
    }
    buildDebris();

    function resize(){
      const w = hero.clientWidth;
      const h = hero.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // Keep a fixed minimum world-space half-extent in view on both axes
      // (so the meteor's entry/exit points and debris stay framed even on
      // narrow/portrait screens), while never zooming in past the desktop
      // baseline on wide screens.
      const minHalfExtent = 2.8;
      camera.position.z = Math.max(6.4, minHalfExtent / (Math.tan(22.5 * Math.PI / 180) * Math.min(1, camera.aspect)));
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    function animate(){
      if (!prefersReducedMotion) {
        globe.rotation.y += 0.0016;
        debris.forEach(d => {
          d.mesh.rotation.x += d.spin.x;
          d.mesh.rotation.y += d.spin.y;
          d.mesh.rotation.z += d.spin.z;
        });
      }
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>
</body>
</html>
