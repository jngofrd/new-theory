<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Theory</title>
<meta name="description" content="New Theory">
<style>
  :root{
    --bg: #050505;
    --bg-soft: #0c0c0c;
    --line-bright: #ffffff;
    --line-dim: #3a3a3a;
    --text: #f5f5f5;
    --text-dim: #8a8a8a;
    --accent: #ffffff;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x:hidden;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #globe-canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
  }
  .hero-content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:0 24px;
    pointer-events:none;
  }
  .hero-vignette{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
    background: radial-gradient(closest-side, rgba(5,5,5,0.82) 0%, rgba(5,5,5,0.45) 45%, rgba(5,5,5,0) 72%);
  }
  .logo{
    width:min(360px, 60vw);
    height:auto;
    filter: drop-shadow(0 0 24px rgba(255,255,255,0.3));
  }
  .tagline{
    margin-top:18px;
    font-size:14px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .scroll-cue{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    width:1px;
    height:40px;
    background:linear-gradient(to bottom, transparent, var(--line-bright));
    opacity:0.6;
    animation: pulse-cue 2.4s ease-in-out infinite;
  }
  @keyframes pulse-cue{
    0%,100%{ opacity:0.2; }
    50%{ opacity:0.8; }
  }

  /* ---------- Video section ---------- */
  .section{
    max-width:960px;
    margin:0 auto;
    padding:96px 24px;
  }
  .video-wrap{
    position:relative;
    width:100%;
    padding-top:56.25%; /* 16:9 */
    background:var(--bg-soft);
    border:1px solid var(--line-dim);
    border-radius:4px;
    overflow:hidden;
    box-shadow: 0 0 40px rgba(255,255,255,0.06);
  }
  .video-wrap iframe{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:0;
  }

  /* ---------- Contact section ---------- */
  .contact-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-bottom:140px;
  }
  .contact-heading{
    font-size:13px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:22px;
  }
  .contact-btn{
    display:inline-block;
    padding:16px 44px;
    border:1px solid var(--accent);
    border-radius:999px;
    color:var(--accent);
    text-decoration:none;
    font-size:14px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }
  .contact-btn:hover{
    background:var(--accent);
    color:#050505;
    box-shadow:0 0 30px rgba(255,255,255,0.4);
  }

  footer{
    text-align:center;
    padding:28px 24px 40px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.08em;
  }
</style>
</head>
<body>

  <section class="hero">
    <canvas id="globe-canvas"></canvas>
    <div class="hero-vignette"></div>
    <div class="hero-content">
      <img class="logo" src="assets/logo.png" alt="New Theory">
    </div>
    <div class="scroll-cue"></div>
  </section>

  <section class="section">
    <div class="video-wrap">
      <!-- TODO: replace VIDEO_ID_HERE with the real YouTube video ID before launch -->
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_HERE"
        title="New Theory"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <section class="contact-section">
    <div class="contact-heading">Get in touch</div>
    <!-- TODO: replace with the real contact address before launch -->
    <a class="contact-btn" href="mailto:hello@newtheory.world">Contact</a>
  </section>

  <footer>&copy; <span id="year"></span> New Theory</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  (function(){
    const canvas = document.getElementById('globe-canvas');
    const hero = document.querySelector('.hero');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

    const globe = new THREE.Group();
    scene.add(globe);

    const RADIUS = 2;

    function latLonToVector3(lat, lon, radius){
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    // Accurate coastlines from real-world land geometry (Natural Earth 50m via world-atlas — a step
    // down from the finest 10m data for a faster load, while still keeping most small islands).
    // There are still tens of thousands of line segments, so they're (a) merged into one
    // LineSegments buffer instead of one Object3D each, and (b) built in a bounded batch per
    // animation frame instead of all at once, so this can't block the main thread on load.
    function addLandOutlines(topology){
      // mesh() (rather than feature()) hands back the coastline as plain open
      // polylines — no polygon-ring bookkeeping to redo on our end.
      const lines = topojson.mesh(topology, topology.objects.land).coordinates;

      let segCount = 0;
      lines.forEach(line => { segCount += Math.max(0, line.length - 1); });

      const positions = new Float32Array(segCount * 2 * 3);
      const attr = new THREE.BufferAttribute(positions, 3);
      attr.setUsage(THREE.DynamicDrawUsage);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', attr);
      geo.setDrawRange(0, 0);

      const landMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.85 });
      globe.add(new THREE.LineSegments(geo, landMat));

      let lineIndex = 0, pointIndex = 0, vertCursor = 0;
      const VERTS_PER_FRAME = 6000; // ~3000 segments/frame — comfortably sub-millisecond

      function buildStep(){
        let budget = VERTS_PER_FRAME;
        while (lineIndex < lines.length && budget > 0) {
          const line = lines[lineIndex];
          while (pointIndex < line.length - 1 && budget > 0) {
            const a = latLonToVector3(line[pointIndex][1], line[pointIndex][0], RADIUS * 1.001);
            const b = latLonToVector3(line[pointIndex + 1][1], line[pointIndex + 1][0], RADIUS * 1.001);
            const o = vertCursor * 3;
            positions[o] = a.x; positions[o + 1] = a.y; positions[o + 2] = a.z;
            positions[o + 3] = b.x; positions[o + 4] = b.y; positions[o + 5] = b.z;
            vertCursor += 2;
            pointIndex++;
            budget -= 2;
          }
          if (pointIndex >= line.length - 1) {
            lineIndex++;
            pointIndex = 0;
          }
        }
        attr.needsUpdate = true;
        geo.setDrawRange(0, vertCursor);
        if (lineIndex < lines.length) requestAnimationFrame(buildStep);
      }
      buildStep();
    }

    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json')
      .then(res => res.json())
      .then(addLandOutlines)
      .catch(() => { /* offline fallback: an empty globe is still framed correctly */ });

    function resize(){
      const w = hero.clientWidth;
      const h = hero.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // Pull back further on narrow/portrait viewports so the globe never
      // overwhelms the frame, and keep it comfortably inset on wide ones.
      camera.position.z = 6.4 / Math.min(camera.aspect, 1) ** 0.5;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // ---- Drag to rotate ----
    // Auto-rotation pauses the moment a viewer grabs the globe, and quietly
    // resumes a couple of seconds after they let go.
    let isDragging = false;
    let autoRotate = true;
    let resumeTimer = null;
    const lastPointer = { x: 0, y: 0 };
    const DRAG_SENSITIVITY = 0.005;
    const AUTO_RESUME_DELAY = 2500;

    canvas.style.cursor = 'grab';
    canvas.style.touchAction = 'none';

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      autoRotate = false;
      if (resumeTimer) clearTimeout(resumeTimer);
      lastPointer.x = e.clientX;
      lastPointer.y = e.clientY;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not all pointer sources support capture */ }
      canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastPointer.x;
      const dy = e.clientY - lastPointer.y;
      lastPointer.x = e.clientX;
      lastPointer.y = e.clientY;
      globe.rotation.y += dx * DRAG_SENSITIVITY;
      globe.rotation.x = Math.max(-0.9, Math.min(0.9, globe.rotation.x + dy * DRAG_SENSITIVITY));
    });

    function endDrag(){
      if (!isDragging) return;
      isDragging = false;
      canvas.style.cursor = 'grab';
      if (!prefersReducedMotion) {
        resumeTimer = setTimeout(() => { autoRotate = true; }, AUTO_RESUME_DELAY);
      }
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    function animate(){
      if (!prefersReducedMotion && autoRotate) {
        globe.rotation.y += 0.0008;
      }
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>
</body>
</html>
